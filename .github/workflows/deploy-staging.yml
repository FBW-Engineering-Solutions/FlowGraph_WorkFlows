name: Upload staging catalog

on:
  workflow_dispatch:
    inputs:
      previous_release:
        description: 'Release ID confirmed in the staging database (64 lowercase hex characters)'
        required: true
        type: string
      confirmation:
        description: 'Type upload-staging after verifying the last cron import and staging backup'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catalog-staging-deployment
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate inputs and catalog
        env:
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[a-f0-9]{64}", os.environ["PREVIOUS_RELEASE"]); assert os.environ["CONFIRMATION"] == "upload-staging"'
          python -m unittest discover -s tests -v
          python tools/validate_catalog.py
      - name: Build child release outside checkout
        env:
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
        run: python tools/build_release.py --previous-release "$PREVIOUS_RELEASE" --output "$RUNNER_TEMP/catalog-release"
      - name: Upload verified bundle to staging inbox
        env:
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
          STAGING_SFTP_USERNAME: ${{ secrets.STAGING_SFTP_USERNAME }}
          STAGING_SFTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          STAGING_SFTP_KNOWN_HOSTS: ${{ secrets.STAGING_SFTP_KNOWN_HOSTS }}
        run: python tools/upload_staging.py --bundle "$RUNNER_TEMP/catalog-release" --previous-release "$PREVIOUS_RELEASE"